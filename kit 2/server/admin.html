<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel Mapamundi — Control de accesos</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#060b18;--card:#0e1b2e;--line:rgba(255,255,255,.1);--tx:#eaf2ff;--mu:rgba(234,242,255,.55);
--v:#22d3ee;--a:#f59e0b;--ok:#34d399;--bad:#f87171;--vi:#a78bfa}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(120% 60% at 15% 0%,#12244a 0,transparent 55%),radial-gradient(90% 50% at 95% 100%,#1b1440 0,transparent 50%),var(--bg);color:var(--tx);font-family:Nunito,sans-serif;min-height:100vh;padding:20px 16px 60px}
.wrap{max-width:1060px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{font-family:'Baloo 2';font-size:24px;display:flex;align-items:center;gap:10px}
h1 svg{flex:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.stat b{font-family:'Baloo 2';font-size:26px;display:block;line-height:1.1}
.stat span{font-size:12.5px;color:var(--mu);letter-spacing:.04em;text-transform:uppercase;font-weight:700}
.s-p b{color:var(--a)}.s-a b{color:var(--ok)}.s-t b{color:var(--v)}
.bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.bar button{background:transparent;border:1px solid var(--line);color:var(--mu);border-radius:999px;padding:7px 15px;font:700 13px Nunito;cursor:pointer}
.bar button.on{border-color:var(--v);color:var(--v);background:rgba(34,211,238,.08)}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;font-size:14px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--mu);text-align:left;padding:11px 12px;border-bottom:1px solid var(--line)}
td{padding:11px 12px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:middle}
tr:last-child td{border-bottom:none}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:800;letter-spacing:.03em}
.p-pend{background:rgba(245,158,11,.15);color:#fbbf24}.p-act{background:rgba(52,211,153,.15);color:var(--ok)}
.p-rev{background:rgba(248,113,113,.13);color:var(--bad)}.p-den{background:rgba(234,242,255,.08);color:var(--mu)}
.key{font-family:ui-monospace,monospace;font-size:12.5px;color:var(--v);cursor:pointer;user-select:all}
.muted{color:var(--mu);font-size:12.5px}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:none;border-radius:9px;padding:7px 12px;font:800 12.5px Nunito;cursor:pointer;color:#0b1020}
.b-ok{background:var(--ok)}.b-warn{background:#fbbf24}.b-bad{background:var(--bad);color:#fff}.b-mut{background:rgba(255,255,255,.1);color:var(--tx)}
.empty{padding:40px 16px;text-align:center;color:var(--mu)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(80px);background:#132a44;border:1px solid var(--line);color:var(--tx);padding:11px 18px;border-radius:12px;font-weight:700;transition:.25s;z-index:9;max-width:90vw}
.toast.show{transform:translateX(-50%) translateY(0)}
dialog{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:18px;padding:24px;max-width:420px;width:92vw}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h3{font-family:'Baloo 2';margin-bottom:6px}
dialog input{width:100%;padding:11px 13px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--tx);font:inherit;margin-top:8px}
.drow{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
@media(max-width:720px){.stats{grid-template-columns:repeat(3,1fr)}.hidesm{display:none}td,th{padding:9px 8px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#22d3ee" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3.5 3.2 3.5 14.8 0 18M12 3c-3.5 3.2-3.5 14.8 0 18"/></svg> Control de accesos</h1>
    <div style="display:flex;gap:8px">
      <a href="/app" target="_blank" style="color:var(--mu);font-size:13px;align-self:center;text-decoration:none">Ver app →</a>
      <button class="btn b-mut" id="out">Salir</button>
    </div>
  </header>

  <div class="stats">
    <div class="stat s-p"><b id="n-pend">–</b><span>Pendientes</span></div>
    <div class="stat s-a"><b id="n-act">–</b><span>Accesos activos</span></div>
    <div class="stat s-t"><b id="n-tot">–</b><span>Total solicitudes</span></div>
  </div>

  <div class="bar" id="tabs">
    <button data-f="pending" class="on">Pendientes</button>
    <button data-f="active">Activos</button>
    <button data-f="all">Todos</button>
  </div>

  <table id="tbl">
    <thead><tr><th>Explorador</th><th class="hidesm">Solicitado</th><th>Estado</th><th class="hidesm">Clave / vence</th><th>Acciones</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="empty" id="empty" hidden>No hay solicitudes aquí todavía.</div>
</div>

<dialog id="dlg">
  <h3>Aprobar acceso</h3>
  <p class="muted" id="d-mail"></p>
  <label class="muted" style="display:block;margin-top:10px">Días de acceso</label>
  <input id="d-days" type="number" min="1" max="3650" value="30">
  <div class="drow">
    <button class="btn b-mut" onclick="dlg.close()">Cancelar</button>
    <button class="btn b-ok" id="d-ok">Aprobar y generar clave</button>
  </div>
</dialog>
<div class="toast" id="toast"></div>

<script>
let ROWS=[],FILTER='pending';
const $=s=>document.querySelector(s);
const fmt=t=>t?new Date(t).toLocaleDateString('es',{day:'numeric',month:'short',year:'numeric'}):'—';
const fmtT=t=>t?new Date(t).toLocaleString('es',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'—';
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),3200)}
async function api(p,body){const r=await fetch(p,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:undefined);if(r.status===401){location.reload();throw 0}return r.json()}

async function load(){
  const [a,b]=await Promise.all([api('/api/admin/requests'),api('/api/admin/stats')]);
  ROWS=a.rows;
  $('#n-pend').textContent=b.pending;$('#n-act').textContent=b.active;$('#n-tot').textContent=b.total;
  render();
}
function render(){
  const now=Date.now();
  let rows=ROWS;
  if(FILTER==='pending')rows=rows.filter(r=>r.state==='pending');
  if(FILTER==='active')rows=rows.filter(r=>r.active);
  $('#empty').hidden=rows.length>0;
  $('#tbl').style.display=rows.length?'':'none';
  $('#rows').innerHTML=rows.map(r=>{
    const pill=r.active?'<span class="pill p-act">ACTIVO</span>':r.state==='pending'?'<span class="pill p-pend">PENDIENTE</span>':r.state==='revoked'?'<span class="pill p-rev">REVOCADO</span>':r.state==='denied'?'<span class="pill p-den">RECHAZADO</span>':'<span class="pill p-den">EXPIRADO</span>';
    const acts=r.state==='pending'
      ?`<button class="btn b-ok" onclick="approve('${r.id}')">Aprobar</button><button class="btn b-bad" onclick="doAct('deny','${r.id}')">Rechazar</button>`
      :r.active
      ?`<button class="btn b-warn" onclick="doAct('revoke','${r.id}')">Revocar</button><button class="btn b-mut" onclick="extend('${r.id}')">+ Días</button>`
      :`<button class="btn b-ok" onclick="approve('${r.id}')">Reactivar</button><button class="btn b-mut" onclick="doAct('delete','${r.id}')">Borrar</button>`;
    return `<tr>
      <td><b>${r.childName?r.childName+' · ':''}</b><span class="muted">${r.email}</span></td>
      <td class="muted hidesm">${fmtT(r.ts)}${r.lastSeen?`<br><small>Usada: ${fmtT(r.lastSeen)}</small>`:''}</td>
      <td>${pill}</td>
      <td class="hidesm">${r.key?`<span class="key" onclick="copy('${r.key}',this)" title="Clic para copiar">${r.key}</span><br><span class="muted">vence ${fmt(r.exp)}</span>`:'<span class="muted">—</span>'}</td>
      <td><div class="acts">${acts}</div></td></tr>`;
  }).join('');
}
function copy(k,el){navigator.clipboard.writeText(k).then(()=>{toast('Clave copiada: '+k)})}

function approve(id){
  const r=ROWS.find(x=>x.id===id);
  $('#d-mail').textContent=(r.childName?r.childName+' — ':'')+r.email;
  $('#d-days').value=30;
  $('#d-ok').onclick=async()=>{
    const d=await api('/api/admin/approve',{id,days:+$('#d-days').value});
    dlg.close();await load();
    toast('Clave '+d.key+' enviada para '+r.email);
  };
  dlg.showModal();
}
async function extend(id){const d=await api('/api/admin/extend',{id,days:+(prompt('¿Cuántos días más?','30')||0)});if(d.ok){await load();toast('Acceso ampliado.')}}
async function doAct(act,id){
  const msgs={deny:'Solicitud rechazada.',revoke:'Acceso revocado. La app se bloqueará en su próximo chequeo.',delete:'Registro borrado.'};
  await api('/api/admin/'+act,{id});await load();toast(msgs[act]);
}
$('#tabs').onclick=e=>{
  if(e.target.tagName!=='BUTTON')return;
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.remove('on'));
  e.target.classList.add('on');FILTER=e.target.dataset.f;render();
};
$('#out').onclick=async()=>{await api('/api/admin/logout',{});location.reload()};
load();setInterval(load,15000);
</script>
</body>
</html>
